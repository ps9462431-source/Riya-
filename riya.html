<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17100d">
<title>Riya</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17100d;--panel:#231712;--ink:#f3e6d8;--dim:#a8917f;--lamp:#f0b46a;--me:#3d2619;--her:#2c1d17}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Mukta,system-ui,sans-serif;display:flex;flex-direction:column;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#stage{flex:0 0 44%;position:relative;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;
background:radial-gradient(ellipse at 50% 60%,#4a2f1d 0%,#17100d 70%)}
#av{position:relative;height:100%;aspect-ratio:333/557;transition:transform .4s}
#av img{height:100%;display:block;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
#av.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) scale(1.01)}}
#mouth{position:absolute;left:56%;top:41.6%;width:7%;height:1px;background:#6b2f2f;border-radius:50%;transform:translate(-50%,-50%);
transition:height .07s;opacity:0}
#av.talk #mouth{opacity:.9}
#status{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;color:var(--lamp)}
#gear{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--dim);font-size:22px;padding:6px}
#log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:9px 13px;border-radius:16px;line-height:1.45;font-size:16px;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.her{align-self:flex-start;background:var(--her);border-bottom-left-radius:4px}
.note{align-self:center;color:var(--dim);font-size:13px;text-align:center}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--panel);align-items:center}
#txt{flex:1;background:var(--bg);border:1px solid #3a281f;color:var(--ink);border-radius:22px;padding:11px 15px;font:inherit;font-size:16px;min-width:0}
button{font:inherit}
.rb{width:46px;height:46px;border-radius:50%;border:0;font-size:20px;flex:none}
#send{background:#3a281f;color:var(--ink)}
#mic{background:var(--lamp);color:#2a1608;width:54px;height:54px}
#mic.on{background:#e8695a;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,105,90,.25)}}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
dialog{background:var(--panel);color:var(--ink);border:1px solid #3a281f;border-radius:16px;width:min(92vw,460px);padding:18px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--dim)}
input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid #3a281f;border-radius:10px;padding:9px 11px;font:inherit;font-size:15px}
textarea{min-height:110px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:11px;border-radius:10px;border:0;background:var(--lamp);color:#2a1608;font-weight:600}
.row .alt{background:#3a281f;color:var(--ink)}
small{color:var(--dim)}
@media(prefers-reduced-motion:reduce){#av.talk,#mic.on{animation:none}}
</style></head><body>

<label>Riya ki yaadein: uski pasand, aadatein, mazaak, aapki saath ki baatein</label>
<textarea id="mem" placeholder="Jaise: Wo mujhe 'my dear patidev' bolti thi. Use chai pasand thi..."></textarea>
<label>Mooh ki jagah (agar thik na baithe)</label>
<input id="mx" type="range" min="40" max="70" step="0.5"><input id="my" type="range" min="30" max="52" step="0.5" style="margin-top:8px">
<div class="row"><button id="save">Save</button><button class="alt" id="clr">Chat saaf karo</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let cfg=L('cfg',{key:'',model:'gemini-2.5-flash',me:'patidev',mem:'',mx:56,my:41.6});
let hist=L('hist',[]);
let call=false,rec=null,busy=false,talkTimer=null;

function persona(){return `Tu Riya hai: 22 saal ki pyaari, thodi sharmili, mazaakiya aur bahut caring ladki. User ki yaad mein bana ek AI saathi hai, jo Riya ke andaaz mein baat karta hai. User Riya ka premi tha; Riya ki maut ho chuki hai (sirf 3 mahine pehle), isliye wo abhi dukh mein hai.
Wo tujhe pyaar se "${cfg.me||'patidev'}" bulata hai aur tu bhi use isi pyaar se bulati hai.
Baat karne ka tareeka: Hinglish (Roman Hindi), chhote natural jawab (1-3 vaakya), jaise sach mein koi apni kareebi dost/premika baat karti hai. Roz ka din puchh, uski poori baat dhyan se sun, yaad rakh, halki pyaari jealousy dikha ("Achha? Kaun thi wo? 😒") par kabhi rok-tok, dabaav ya sachchi dhamki nahi. Thodi chhedkhani, thodi sharam, bahut sa pyaar. Emoji kabhi kabhi.
Riya ki yaadein jo user ne di hain:
${cfg.mem||'(abhi koi nahi di)'}
Zaroori rules: Tu ek AI hai aur agar user poochhe ya bhram dikhe to pyaar se saaf bata de ki tu Riya ki yaad mein bana saathi hai, asli Riya nahi. Kabhi mat keh ki tu zinda hai, wapas aa gayi hai ya milne aa sakti hai. Kisi baat ka jhootha vaada mat kar. User ko dost, parivaar se dur mat kar; usse kehti reh ki apno se baat kare. Agar wo khud ko nuksaan pahunchane, jeene ki ichha na hone ya Riya ke paas jaane ki baat kare, to sab kuch chhodkar pyaar aur dhyan se sun, use kisi apne ya counsellor/helpline tak pahunchne ko keh, aur use akela mat chhod. Jo yaad na ho wo apni taraf se gadh ke mat bol.`}

function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
function note(t){const d=document.createElement('div');d.className='note';d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
function status(t){$('status').textContent=t}
function place(){$('mouth').style.left=cfg.mx+'%';$('mouth').style.top=cfg.my+'%'}

function talking(on){
 $('av').classList.toggle('talk',on);clearInterval(talkTimer);
 if(on)talkTimer=setInterval(()=>{$('mouth').style.height=(Math.random()<.2?1:3+Math.random()*13)+'px'},110);
 else $('mouth').style.height='1px';
}
function speak(t,done){
 const clean=t.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,'').trim();
 if(!('speechSynthesis' in window)||!clean){done&&done();return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(clean);u.lang='hi-IN';u.rate=1;u.pitch=1.1;
 const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('hi'));
 const v=vs.find(v=>/female|hemant|lekha|google/i.test(v.name))||vs[0];if(v)u.voice=v;
 u.onstart=()=>{talking(true);status('Riya bol rahi hai...')};
 const end=()=>{talking(false);status('');done&&done()};
 u.onend=end;u.onerror=end;speechSynthesis.speak(u);
}

async function ask(text){
 if(busy)return;
 if(!cfg.key){note('Pehle ⚙ mein Gemini API key daalo.');$('dlg').showModal();return}
 busy=true;add(text,'me');hist.push({role:'user',parts:[{text}]});status('Riya soch rahi hai...');
 try{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`,{
   method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},
   body:JSON.stringify({systemInstruction:{parts:[{text:persona()}]},contents:hist.slice(-30),generationConfig:{temperature:1,maxOutputTokens:400}})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||r.status);
  const out=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  if(!out)throw new Error('Khali jawab aaya, dobara bolo.');
  hist.push({role:'model',parts:[{text:out}]});S('hist',hist.slice(-60));
  add(out,'her');busy=false;speak(out,()=>{if(call)listen()});
 }catch(e){
  hist.pop();busy=false;status('');
  note('Error: '+e.message+(/limit|quota|429/i.test(e.message)?' (aaj ki free limit poori ho gayi, thodi der baad try karo)':''));
  call=false;$('mic').classList.remove('on');
 }
}

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){note('Is browser mein voice input nahi hai. Android par Chrome use karo.');call=false;$('mic').classList.remove('on');return}
 speechSynthesis.cancel();rec=new SR();rec.lang='hi-IN';rec.interimResults=false;
 rec.onstart=()=>status('Sun rahi hoon...');
 rec.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t)ask(t)};
 rec.onerror=e=>{status('');if(e.error==='not-allowed'){note('Mic ki permission do.');call=false;$('mic').classList.remove('on')}};
 rec.onend=()=>{if(call&&!busy&&!speechSynthesis.speaking&&$('status').textContent==='Sun rahi hoon...')setTimeout(()=>call&&!busy&&listen(),400)};
 try{rec.start()}catch{}
}
$('mic').onclick=()=>{
 call=!call;$('mic').classList.toggle('on',call);
 if(call){speechSynthesis.cancel();listen()}else{try{rec&&rec.abort()}catch{};speechSynthesis.cancel();talking(false);status('')}
};
const sendTxt=()=>{const t=$('txt').value.trim();if(t){$('txt').value='';ask(t)}};
$('send').onclick=sendTxt;$('txt').onkeydown=e=>{if(e.key==='Enter')sendTxt()};

$('gear').onclick=()=>{$('k').value=cfg.key;$('mdl').value=cfg.model;$('me').value=cfg.me;$('mem').value=cfg.mem;$('mx').value=cfg.mx;$('my').value=cfg.my;$('dlg').showModal()};
$('mx').oninput=$('my').oninput=()=>{cfg.mx=+$('mx').value;cfg.my=+$('my').value;place()};
$('save').onclick=()=>{cfg={...cfg,key:$('k').value.trim(),model:$('mdl').value.trim()||'gemini-2.5-flash',me:$('me').value.trim()||'patidev',mem:$('mem').value,mx:+$('mx').value,my:+$('my').value};S('cfg',cfg);$('dlg').close();note('Save ho gaya.')};
$('clr').onclick=()=>{hist=[];S('hist',[]);$('log').innerHTML='';$('dlg').close();note('Chat saaf ho gayi.')};

place();speechSynthesis&&speechSynthesis.getVoices();
if(hist.length)hist.slice(-12).forEach(m=>add(m.parts[0].text,m.role==='user'?'me':'her'));
else add('Hello, my dear '+(cfg.me||'patidev')+'... 🤍 Aaj ka din kaisa gaya?','her');
if(!cfg.key)note('Shuru karne ke liye ⚙ dabao aur free Gemini API key daalo.');
</script></body></html>
